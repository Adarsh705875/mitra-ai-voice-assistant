<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitra AI | Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05080b;
      --cyan: #00f0ff;
      --text: #e8f7fa;
      --muted: #7fa3aa;
      --panel: rgba(255, 255, 255, 0.05);
      --line: rgba(0, 240, 255, 0.18);
      --danger: #ff5c6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #0b1418, var(--bg) 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
    }
    .orb {
      width: 200px; height: 200px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: radial-gradient(circle, #0e1a1f, #0a0f12);
      display: grid; place-items: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .orb:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; }
    .orb.listening { box-shadow: 0 0 30px var(--cyan), 0 0 70px rgba(0, 240, 255, 0.5); transform: scale(1.06); }
    .orb.speaking { transform: scale(1.15); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px var(--cyan), 0 0 50px rgba(0, 240, 255, 0.5); }
      50% { box-shadow: 0 0 35px #fff, 0 0 90px var(--cyan); }
    }
    .orb-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      text-shadow: 0 0 12px var(--cyan);
    }
    .hint { color: var(--muted); font-size: 0.95rem; margin: 0; text-align: center; }
    .response {
      width: min(440px, 100%);
      min-height: 64px;
      max-height: 240px;
      overflow-y: auto;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      line-height: 1.5;
      text-align: center;
    }
    .response.error { color: var(--danger); border-color: rgba(255, 92, 108, 0.4); }
    .controls { display: flex; gap: 8px; width: min(440px, 100%); }
    .controls input {
      flex: 1;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0a1216;
      color: var(--text);
      font: inherit;
    }
    button {
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0a1216;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--cyan); color: #00181b; border-color: var(--cyan); font-weight: 500; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    details { width: min(440px, 100%); color: var(--muted); font-size: 0.9rem; }
    summary { cursor: pointer; }
    .settings { display: grid; gap: 8px; margin-top: 10px; }
    .settings label { display: grid; gap: 4px; }
    .settings select,
    .settings input {
      padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: #0a1216; color: var(--text); font: inherit;
    }
    .settings p { margin: 0; font-size: 0.82rem; }
    @media (prefers-reduced-motion: reduce) {
      .orb, .orb.speaking { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <button class="orb" id="orb" aria-label="Tap to speak to Mitra">
    <span class="orb-name">Mitra</span>
  </button>

  <p class="hint" id="hint">Tap the orb to speak, or type below.</p>
  <div class="response" id="response" aria-live="polite">Add your API key under Settings to start.</div>

  <div class="controls">
    <input type="text" id="textInput" placeholder="Type a message..." aria-label="Message" />
    <button class="primary" id="sendBtn">Send</button>
  </div>

  <details id="settingsBox">
    <summary>Settings (API keys)</summary>
    <div class="settings">
      <label>Gemini API key (recommended, used first)
        <input type="password" id="geminiKey" placeholder="Paste your Gemini key" autocomplete="off" />
      </label>
      <label>Gemini model
        <select id="geminiModel">
          <option value="auto">Auto (try several until one works)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
          <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
          <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
          <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
          <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
          <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
          <option value="gemini-flash-latest">Gemini Flash (latest alias)</option>
        </select>
      </label>
      <label>Speech language (what you speak)
        <select id="speechLang">
          <option value="en-IN">English (India)</option>
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">Hindi</option>
          <option value="mr-IN">Marathi</option>
          <option value="kn-IN">Kannada</option>
        </select>
      </label>
      <label>Mistral API key (used if no Gemini key)
        <input type="password" id="mistralKey" placeholder="Paste your Mistral key" autocomplete="off" />
      </label>
      <label>ElevenLabs API key (optional, for a natural voice)
        <input type="password" id="elevenKey" placeholder="Leave empty to use the browser voice" autocomplete="off" />
      </label>
      <button id="saveKeys">Save keys</button>
      <p>Keys are saved only in this browser (localStorage). They are never sent anywhere except Mistral and ElevenLabs.</p>
    </div>
  </details>

  <script>
    const orb = document.getElementById('orb');
    const responseBox = document.getElementById('response');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const hint = document.getElementById('hint');
    const mistralInput = document.getElementById('mistralKey');
    const elevenInput = document.getElementById('elevenKey');
    const settingsBox = document.getElementById('settingsBox');

    const VOICE_ID = 'pNInz6obpgDQGcFmaJgB'; // ElevenLabs "Adam"
    const history = [];

    // ---- key storage (browser only, never hardcoded) ----
    function getKey(name) {
      try { return localStorage.getItem(name) || ''; } catch { return ''; }
    }
    function setKey(name, value) {
      try { localStorage.setItem(name, value); } catch { /* storage blocked */ }
    }
    const geminiInput = document.getElementById('geminiKey');
    const langSelect = document.getElementById('speechLang');
    langSelect.value = getKey('mitra_lang') || 'en-IN';
    langSelect.addEventListener('change', () => {
      setKey('mitra_lang', langSelect.value);
      showMessage(`Speech language set to ${langSelect.options[langSelect.selectedIndex].text}.`);
    });
    const modelSelect = document.getElementById('geminiModel');
    modelSelect.value = getKey('mitra_gemini_model') || 'auto';
    if (!modelSelect.value) modelSelect.value = 'auto';
    modelSelect.addEventListener('change', () => {
      setKey('mitra_gemini_model', modelSelect.value);
      showMessage(`Model set to ${modelSelect.options[modelSelect.selectedIndex].text}.`);
    });
    geminiInput.value = getKey('mitra_gemini_key');
    mistralInput.value = getKey('mitra_mistral_key');
    elevenInput.value = getKey('mitra_eleven_key');
    if (!geminiInput.value && !mistralInput.value) settingsBox.open = true;

    document.getElementById('saveKeys').addEventListener('click', () => {
      setKey('mitra_gemini_key', geminiInput.value.trim());
      setKey('mitra_mistral_key', mistralInput.value.trim());
      setKey('mitra_eleven_key', elevenInput.value.trim());
      showMessage('Keys saved. Say hello to Mitra.');
      settingsBox.open = false;
    });

    function showMessage(text, isError = false) {
      responseBox.textContent = text;
      responseBox.classList.toggle('error', isError);
    }

    // ---- chat (Mistral) ----
    const SYSTEM_PROMPT = 'You are Mitra, a friendly voice assistant. Keep replies short and conversational. Do not introduce yourself every time. Always reply in the same language and script the user used (for example Hindi or Marathi in Devanagari).';

    // Tried in order; if Google retires one (404), the next is used.
    const GEMINI_MODELS = ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-flash-latest', 'gemini-2.5-flash'];

    async function fetchGeminiReply(text, key) {
      history.push({ role: 'user', content: text });
      let res;
      const chosen = getKey('mitra_gemini_model');
      const modelsToTry = chosen && chosen !== 'auto' ? [chosen] : GEMINI_MODELS;
      for (const model of modelsToTry) {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: history.slice(-10).map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
          }))
        })
      });
      if (res.status !== 404) break; // 404 = model name not available, try the next one
      }
      if (res.status === 404) throw new Error(
        modelsToTry.length === 1
          ? `The model "${modelsToTry[0]}" is not available for this key. Pick another model under Settings.`
          : 'No Gemini model was found for this key. Check that the Generative Language API is enabled for your project.'
      );
      if (res.status === 400 || res.status === 403) throw new Error('Gemini rejected the API key. Check it under Settings.');
      if (res.status === 429) throw new Error('Gemini rate limit reached. Wait a moment and try again.');
      if (!res.ok) throw new Error(`Gemini request failed (${res.status}).`);
      const data = await res.json();
      const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || 'Sorry, I could not come up with a reply.';
      history.push({ role: 'assistant', content: reply });
      return reply;
    }

    async function fetchReply(text) {
      const geminiKey = getKey('mitra_gemini_key');
      if (geminiKey) return fetchGeminiReply(text, geminiKey);

      const key = getKey('mitra_mistral_key');
      if (!key) throw new Error('Missing API key. Add a Gemini or Mistral key under Settings.');

      history.push({ role: 'user', content: text });
      const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({
          model: 'mistral-small-latest',
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...history.slice(-10)
          ]
        })
      });
      if (res.status === 401) throw new Error('Mistral rejected the API key. Check it under Settings.');
      if (res.status === 429) throw new Error('Mistral rate limit reached. Wait a moment and try again.');
      if (!res.ok) throw new Error(`Mistral request failed (${res.status}).`);

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'Sorry, I could not come up with a reply.';
      history.push({ role: 'assistant', content: reply });
      return reply;
    }

    // ---- voice output ----
    function speakWithBrowser(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      // Pick the voice language from the script of the reply
      const chosenLang = getKey('mitra_lang') || 'en-IN';
      let lang = 'en-IN';
      if (/[\u0900-\u097F]/.test(text)) lang = chosenLang === 'mr-IN' ? 'mr-IN' : 'hi-IN';
      else if (/[\u0C80-\u0CFF]/.test(text)) lang = 'kn-IN';
      else if (chosenLang === 'en-US' || chosenLang === 'en-GB') lang = chosenLang;
      u.lang = lang;
      const voices = speechSynthesis.getVoices();
      const norm = v => v.lang.replace('_', '-').toLowerCase();
      const voice = voices.find(v => norm(v) === lang.toLowerCase())
        || voices.find(v => norm(v).startsWith(lang.split('-')[0]));
      if (voice) u.voice = voice;
      else if (!lang.startsWith('en')) {
        showMessage(`${text}\n\n(No ${lang} voice is installed on this device, so I can only show text. Install one in your system's speech settings.)`);
      }
      u.onstart = () => orb.classList.add('speaking');
      u.onend = u.onerror = () => orb.classList.remove('speaking');
      speechSynthesis.speak(u);
    }

    async function speakWithElevenLabs(text, key) {
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
        method: 'POST',
        headers: { 'xi-api-key': key, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
        body: JSON.stringify({
          text,
          model_id: 'eleven_multilingual_v2',
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });
      if (!res.ok) throw new Error(`ElevenLabs failed (${res.status})`);
      const audio = new Audio(URL.createObjectURL(await res.blob()));
      audio.onplay = () => orb.classList.add('speaking');
      audio.onended = audio.onerror = () => orb.classList.remove('speaking');
      await audio.play();
    }

    async function speak(text) {
      const key = getKey('mitra_eleven_key');
      if (!key) return speakWithBrowser(text);
      try {
        await speakWithElevenLabs(text, key);
      } catch (err) {
        console.error(err);
        speakWithBrowser(text); // fall back so the user still hears the reply
      }
    }

    // ---- send flow ----
    async function handleSend(text) {
      text = (text ?? textInput.value).trim();
      if (!text) return;
      textInput.value = '';
      showMessage('Thinking...');
      try {
        const reply = await fetchReply(text);
        showMessage(reply);
        await speak(reply);
      } catch (err) {
        console.error(err);
        const isNetwork = err instanceof TypeError;
        showMessage(
          isNetwork
            ? 'Could not reach the AI service. Check your internet, turn off ad blockers or VPN, and open the page from http://localhost or GitHub Pages instead of a file.'
            : (err.message || 'Something went wrong. Try again.'),
          true
        );
      }
    }
    sendBtn.addEventListener('click', () => handleSend());
    textInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

    // ---- voice input (Web Speech API) ----
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.onstart = () => { orb.classList.add('listening'); hint.textContent = 'Listening...'; };
      recognition.onend = () => { orb.classList.remove('listening'); hint.textContent = 'Tap the orb to speak, or type below.'; };
      const MIC_ERRORS = {
        'not-allowed': 'Microphone is blocked. Click the lock icon in the address bar, allow Microphone, then reload.',
        'service-not-allowed': 'Speech recognition is blocked in this browser. Use Chrome or Edge.',
        'no-speech': 'I did not hear anything. Check your mic is selected in your system settings and speak right after tapping the orb.',
        'audio-capture': 'No microphone found. Plug one in or choose the right input device.',
        'network': 'Speech recognition needs internet and Google servers. Check your connection, turn off VPN, or use Chrome instead of Brave.',
        'language-not-supported': 'This language is not supported here. Pick another under Settings.'
      };
      recognition.onerror = e => {
        if (e.error === 'aborted') return;
        showMessage(MIC_ERRORS[e.error] || `Microphone error: ${e.error}. You can type instead.`, true);
      };
      recognition.onresult = e => {
        const heard = e.results[0][0].transcript;
        showMessage(`You said: "${heard}"`);
        handleSend(heard);
      };
    } else {
      hint.textContent = 'Voice input is not supported in this browser. Use Chrome or Edge, or type below.';
    }
    orb.addEventListener('click', () => {
      if (!recognition) return textInput.focus();
      speechSynthesis.cancel();
      recognition.lang = getKey('mitra_lang') || 'en-IN';
      try { recognition.start(); } catch { /* already listening */ }
    });
  </script>
</body>
</html>
